services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@db:5432/checkout
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.init_db && uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: .
    profiles: ["chain"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://checkout:checkout@db:5432/checkout
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: checkout
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - checkout_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  checkout_db:
